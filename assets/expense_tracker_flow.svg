<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 950" width="1100" height="950" role="img" aria-label="Expense Tracker Program Flow">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="950" fill="#FFFFFF"/>
  <rect x="8" y="8" width="1084" height="934" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="550" y="38" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Program Flow: Institute Expense Tracker (expense_tracker.py)</text>

  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="600">
    <rect x="200" y="52" width="90" height="22" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
    <text x="245" y="67" text-anchor="middle" fill="#1E3A8A">Input</text>
    <rect x="305" y="52" width="100" height="22" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="355" y="67" text-anchor="middle" fill="#4C1D95">Decision</text>
    <rect x="420" y="52" width="110" height="22" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/>
    <text x="475" y="67" text-anchor="middle" fill="#065F46">Success / Output</text>
    <rect x="545" y="52" width="110" height="22" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
    <text x="600" y="67" text-anchor="middle" fill="#991B1B">Error / Reject</text>
    <rect x="670" y="52" width="110" height="22" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
    <text x="725" y="67" text-anchor="middle" fill="#92400E">Warning / Notice</text>
    <rect x="795" y="52" width="105" height="22" rx="4" fill="#F1F5F9" stroke="#334155" stroke-width="1.2"/>
    <text x="847" y="67" text-anchor="middle" fill="#0F172A">Process / State</text>
  </g>
  <line x1="30" y1="84" x2="1070" y2="84" stroke="#E2E8F0" stroke-width="1.2"/>

  <rect x="475" y="96" width="150" height="36" rx="18" fill="#0F172A"/>
  <text x="550" y="119" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">START</text>
  <line x1="550" y1="132" x2="550" y2="154" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <polygon points="550,154 665,194 550,234 435,194" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="550" y="190" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#4C1D95">expenses.csv</text>
  <text x="550" y="206" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#4C1D95">exists?</text>

  <line x1="665" y1="194" x2="740" y2="194" stroke="#D97706" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <text x="700" y="186" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#92400E">No</text>
  <rect x="740" y="166" width="286" height="56" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="883" y="190" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#92400E">Catch FileNotFoundError</text>
  <text x="883" y="208" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#78350F">Print notice &amp; initialize expenses = []</text>

  <line x1="435" y1="194" x2="360" y2="194" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="398" y="186" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#065F46">Yes</text>
  <rect x="74" y="166" width="286" height="56" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="1.8"/>
  <text x="217" y="190" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0F172A">load_expenses()</text>
  <text x="217" y="208" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#334155">Parse CSV rows (warn &amp; skip malformed)</text>

  <path d="M 217 222 L 217 256 L 550 256 L 550 278" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 883 222 L 883 256 L 550 256" fill="none" stroke="#475569" stroke-width="1.8"/>

  <rect x="395" y="278" width="310" height="56" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="550" y="302" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#1E3A8A">display_menu() &amp; Input Choice</text>
  <text x="550" y="320" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1E40AF">1: Add | 2: Show | 3: Totals | 4: Exit</text>
  <line x1="550" y1="334" x2="550" y2="360" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <polygon points="550,360 665,396 550,432 435,396" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="550" y="393" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#4C1D95">Choice in</text>
  <text x="550" y="408" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#4C1D95">{1, 2, 3, 4}?</text>

  <line x1="665" y1="396" x2="758" y2="396" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="708" y="388" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#991B1B">No</text>
