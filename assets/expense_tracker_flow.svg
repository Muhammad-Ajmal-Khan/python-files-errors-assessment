  <text x="465" y="566" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#4C1D95">empty?</text>

  <line x1="465" y1="594" x2="465" y2="632" stroke="#D97706" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
