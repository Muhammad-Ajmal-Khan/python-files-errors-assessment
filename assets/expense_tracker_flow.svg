  <line x1="550" y1="432" x2="550" y2="462" stroke="#059669" stroke-width="1.8"/>
  <text x="568" y="450" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#065F46">Yes</text>
  <line x1="165" y1="462" x2="965" y2="462" stroke="#475569" stroke-width="1.8"/>

  <line x1="165" y1="462" x2="165" y2="514" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="465" y1="462" x2="465" y2="514" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="725" y1="462" x2="725" y2="514" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="965" y1="462" x2="965" y2="514" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="115" y="476" width="100" height="22" rx="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="165" y="491" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1E3A8A">Choice 1: Add</text>

  <rect x="410" y="476" width="110" height="22" rx="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="465" y="491" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1E3A8A">Choice 2: Show</text>

  <rect x="668" y="476" width="114" height="22" rx="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="725" y="491" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1E3A8A">Choice 3: Totals</text>

  <rect x="915" y="476" width="100" height="22" rx="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="965" y="491" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#1E3A8A">Choice 4: Exit</text>

  <rect x="52" y="514" width="226" height="60" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
