  <text x="465" y="659" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#92400E">"No expenses recorded yet."</text>

  <path d="M 375 554 L 340 554 L 340 812 L 355 812" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="358" y="546" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#065F46">No</text>
  <rect x="355" y="780" width="220" height="64" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/>
  <text x="465" y="804" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#065F46">Print All Expenses</text>
  <text x="465" y="821" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#047857">+ Unique Categories via set()</text>
  <text x="465" y="836" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#047857">(sorted alphabetically)</text>

  <polygon points="725,514 815,554 725,594 635,554" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="725" y="551" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#4C1D95">expenses</text>
  <text x="725" y="566" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#4C1D95">empty?</text>

  <line x1="725" y1="594" x2="725" y2="632" stroke="#D97706" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <text x="740" y="616" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#92400E">Yes</text>
  <rect x="615" y="632" width="220" height="46" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="725" y="659" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#92400E">"No expenses recorded yet."</text>

  <path d="M 635 554 L 600 554 L 600 812 L 615 812" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="618" y="546" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#065F46">No</text>
  <rect x="615" y="780" width="220" height="64" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/>
  <text x="725" y="804" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#065F46">Aggregate by Category</text>
  <text x="725" y="821" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#047857">Print sorted category subtotals</text>
  <text x="725" y="836" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#047857">&amp; overall Grand Total</text>

  <rect x="875" y="514" width="180" height="54" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.8"/>
  <text x="965" y="538" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#065F46">Print Goodbye</text>
  <text x="965" y="556" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#047857">Break menu loop</text>
  <line x1="965" y1="568" x2="965" y2="616" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <rect x="895" y="616" width="140" height="38" rx="19" fill="#0F172A"/>
  <text x="965" y="640" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">END</text>

  <line x1="165" y1="840" x2="165" y2="892" stroke="#475569" stroke-width="1.6"/>
  <line x1="465" y1="844" x2="465" y2="892" stroke="#475569" stroke-width="1.6"/>
  <path d="M 575 655 L 588 655 L 588 892" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="4,3"/>
