  <path d="M 835 655 L 850 655 L 850 892" fill="none" stroke="#475569" stroke-width="1.4" stroke-dasharray="4,3"/>

  <path d="M 165 892 L 1070 892 L 1070 320 L 705 320" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="465" y="878" width="210" height="24" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
  <text x="570" y="894" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#334155">Return to Main Menu Loop</text>
