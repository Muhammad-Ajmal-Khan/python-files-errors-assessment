  <text x="165" y="553" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1E40AF">Date (DD-MM-YYYY), Item,</text>
  <text x="165" y="567" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1E40AF">Category, Amount (&gt; 0)</text>
