  <text x="881" y="394" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#991B1B">Invalid Choice Error</text>
  <text x="881" y="410" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#7F1D1D">Prompt to enter 1-4</text>
