  <polygon points="165,598 265,636 165,674 65,636" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="165" y="633" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#4C1D95">Valid date, text,</text>
  <text x="165" y="648" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#4C1D95">&amp; amount &gt; 0?</text>

  <line x1="165" y1="674" x2="165" y2="704" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="180" y="693" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#991B1B">No</text>
  <rect x="52" y="704" width="226" height="54" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
