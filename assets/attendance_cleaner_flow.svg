<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 790" width="940" height="790" role="img" aria-label="Attendance Cleaner Program Flow">
  <defs>
    <marker id="a-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="790" fill="#FFFFFF"/>
  <rect x="8" y="8" width="924" height="774" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>

  <text x="470" y="38" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Program Flow: Student Attendance Cleaner (attendance_cleaner.py)</text>

  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="600">
    <rect x="120" y="52" width="90" height="22" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
    <text x="165" y="67" text-anchor="middle" fill="#1E3A8A">Input</text>
    <rect x="225" y="52" width="100" height="22" rx="4" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="275" y="67" text-anchor="middle" fill="#4C1D95">Decision</text>
    <rect x="340" y="52" width="110" height="22" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/>
    <text x="395" y="67" text-anchor="middle" fill="#065F46">Success / Output</text>
    <rect x="465" y="52" width="110" height="22" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.2"/>
    <text x="520" y="67" text-anchor="middle" fill="#991B1B">Error / Reject</text>
    <rect x="590" y="52" width="110" height="22" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
    <text x="645" y="67" text-anchor="middle" fill="#92400E">Warning</text>
    <rect x="715" y="52" width="105" height="22" rx="4" fill="#F1F5F9" stroke="#334155" stroke-width="1.2"/>
    <text x="767" y="67" text-anchor="middle" fill="#0F172A">Process / State</text>
  </g>
  <line x1="30" y1="84" x2="910" y2="84" stroke="#E2E8F0" stroke-width="1.2"/>

  <rect x="205" y="100" width="150" height="36" rx="18" fill="#0F172A"/>
  <text x="280" y="123" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">START</text>
  <line x1="280" y1="136" x2="280" y2="160" stroke="#475569" stroke-width="1.8" marker-end="url(#a-slate)"/>

  <rect x="130" y="160" width="300" height="50" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="280" y="182" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#1E3A8A">read_raw_attendance("attendance.txt")</text>
  <text x="280" y="199" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#1E40AF">Open &amp; read all lines from input text file</text>
  <line x1="280" y1="210" x2="280" y2="236" stroke="#475569" stroke-width="1.8" marker-end="url(#a-slate)"/>

  <polygon points="280,236 410,276 280,316 150,276" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="280" y="272" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#4C1D95">File found &amp;</text>
  <text x="280" y="288" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#4C1D95">readable?</text>

  <line x1="410" y1="276" x2="508" y2="276" stroke="#DC2626" stroke-width="1.8" marker-end="url(#a-red)"/>
  <text x="458" y="268" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#991B1B">No</text>
  <rect x="508" y="248" width="316" height="56" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="666" y="271" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#991B1B">Catch FileNotFoundError / OSError</text>
  <text x="666" y="289" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7F1D1D">Print error message &amp; return gracefully</text>

  <line x1="280" y1="316" x2="280" y2="346" stroke="#059669" stroke-width="1.8" marker-end="url(#a-green)"/>
  <text x="298" y="334" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#065F46">Yes</text>

  <rect x="85" y="346" width="390" height="64" rx="8" fill="#F1F5F9" stroke="#334155" stroke-width="1.8"/>
  <text x="280" y="369" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#0F172A">clean_attendance_names(raw_names)</text>
  <text x="280" y="387" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#334155">1. List comprehension: strip(), split(), title(), drop blanks</text>
  <text x="280" y="403" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#334155">2. Deduplicate with set() &amp; sort with sorted()</text>
  <line x1="280" y1="410" x2="280" y2="436" stroke="#475569" stroke-width="1.8" marker-end="url(#a-slate)"/>

  <polygon points="280,436 410,476 280,516 150,476" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="280" y="472" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#4C1D95">Any valid</text>
  <text x="280" y="488" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#4C1D95">student names?</text>

  <line x1="410" y1="476" x2="508" y2="476" stroke="#D97706" stroke-width="1.8" marker-end="url(#a-amber)"/>
  <text x="458" y="468" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#92400E">No</text>
  <rect x="508" y="448" width="316" height="56" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
  <text x="666" y="471" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#92400E">Warning: Empty Input File</text>
  <text x="666" y="489" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#78350F">Inform user &amp; skip creating CSV output</text>

  <line x1="280" y1="516" x2="280" y2="544" stroke="#059669" stroke-width="1.8" marker-end="url(#a-green)"/>
  <text x="298" y="534" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#065F46">Yes</text>

  <polygon points="280,544 438,586 280,628 122,586" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="280" y="582" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#4C1D95">write_clean_attendance()</text>
  <text x="280" y="598" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#4C1D95">succeeded?</text>

  <line x1="438" y1="586" x2="508" y2="586" stroke="#DC2626" stroke-width="1.8" marker-end="url(#a-red)"/>
  <text x="472" y="578" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#991B1B">No</text>
  <rect x="508" y="558" width="316" height="56" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="666" y="581" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#991B1B">Catch OSError on CSV Write</text>
  <text x="666" y="599" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#7F1D1D">Print file write error &amp; terminate</text>

  <line x1="280" y1="628" x2="280" y2="656" stroke="#059669" stroke-width="1.8" marker-end="url(#a-green)"/>
  <text x="298" y="646" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#065F46">Yes</text>

  <rect x="100" y="656" width="360" height="56" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <text x="280" y="679" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" fill="#065F46">display_summary() &amp; Saved CSV</text>
  <text x="280" y="697" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" fill="#047857">Print counts, output path &amp; alphabetical roster</text>
  <line x1="280" y1="712" x2="280" y2="734" stroke="#475569" stroke-width="1.8" marker-end="url(#a-slate)"/>

  <rect x="205" y="734" width="150" height="36" rx="18" fill="#0F172A"/>
  <text x="280" y="757" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">END</text>

  <path d="M 824 276 L 878 276 L 878 752 L 355 752" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#a-slate)"/>
  <line x1="824" y1="476" x2="878" y2="476" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5,3"/>
  <line x1="824" y1="586" x2="878" y2="586" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5,3"/>
</svg>
